<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      The head below is the homepage's. Every other route gets its own copy of
      this file with the metadata block swapped — see scripts/prerender.mjs and
      lib/seo.js, which is the single source both this file and the client-side
      hook read from.

      Keep the tag shapes here intact: the prerender script matches on them and
      fails the build rather than silently shipping the homepage's title.
    -->
    <title>Automated Trading That Shows Its Reasoning | Forge Capmoor</title>
    <meta
      name="description"
      content="Forge Capmoor is an automated trading platform. It reads the market, trades the strategy you choose, and records the reasoning behind every move it makes."
    />
    <link rel="canonical" href="https://forge-capmoor.net/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />

    <!-- Icons. The SVG favicon is the primary; the PNG fallback covers
         browsers and platforms that still will not read an SVG icon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts are self-hosted (no third-party request, no render-blocking
         Google Fonts stylesheet). Preloading both variable files means the
         H1 usually paints in Bricolage on first frame rather than swapping,
         which keeps layout shift from the font swap close to zero. -->
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Open Graph. og:title, og:description and og:url are rewritten per
         route at build time; the rest are the same everywhere. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Forge Capmoor" />
    <meta property="og:title" content="Automated Trading That Shows Its Reasoning | Forge Capmoor" />
    <meta
      property="og:description"
      content="Forge Capmoor is an automated trading platform. It reads the market, trades the strategy you choose, and records the reasoning behind every move it makes."
    />
    <meta property="og:url" content="https://forge-capmoor.net/" />
    <meta property="og:image" content="https://forge-capmoor.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Forge Capmoor wordmark on a warm off-white ground, with a copper rule beneath it." />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter / X. No twitter:site or twitter:creator: the brand has no X
         account, and naming a handle that does not exist would attribute the
         card to a stranger. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Automated Trading That Shows Its Reasoning | Forge Capmoor" />
    <meta
      name="twitter:description"
      content="Forge Capmoor is an automated trading platform. It reads the market, trades the strategy you choose, and records the reasoning behind every move it makes."
    />
    <meta name="twitter:image" content="https://forge-capmoor.net/og-image.png" />
    <meta name="twitter:image:alt" content="The Forge Capmoor wordmark on a warm off-white ground, with a copper rule beneath it." />

    <!--
      Minimal critical CSS. Establishes the page background and the text
      fallback stack before the main stylesheet arrives, so the first paint
      is never an unstyled white flash or an invisible-text frame.
    -->
    <style>
      html {
        background: #ffffff;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: #0e0e11;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
      }
    </style>

    <!--
      Organization + WebSite structured data. The FAQPage graph is emitted by
      the FAQ page itself — and only there — so the schema and the visible copy
      can never drift apart, and no second URL carries a duplicate FAQPage.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://forge-capmoor.net/#organization",
            "name": "Forge Capmoor",
            "url": "https://forge-capmoor.net/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://forge-capmoor.net/apple-touch-icon.png",
              "width": 180,
              "height": 180
            },
            "description": "Forge Capmoor builds an automated trading platform that reads market data, trades the strategy a client chooses, and records the reasoning behind every action it takes.",
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@forge-capmoor.net",
              "areaServed": "AU",
              "availableLanguage": "en"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://forge-capmoor.net/#website",
            "url": "https://forge-capmoor.net/",
            "name": "Forge Capmoor",
            "publisher": { "@id": "https://forge-capmoor.net/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
