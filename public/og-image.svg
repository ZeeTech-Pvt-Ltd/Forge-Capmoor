<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Source artwork for og-image.png (generated by scripts/generate-images.mjs).

    Kept in the repository as an SVG so the social card can be edited as
    vector geometry, and rasterised once at build time — social platforms will
    not accept an SVG, but everything here is drawn rather than photographed,
    so the PNG stays small and sharp.
  -->
  <defs>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A4D"/>
      <stop offset="0.55" stop-color="#FF4B2B"/>
      <stop offset="1" stop-color="#E23A1B"/>
    </linearGradient>

    <radialGradient id="wash" cx="0.5" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#FF4B2B" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#FF9E45" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FF9E45" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4B2B" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FF4B2B" stop-opacity="0.34"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#wash)"/>

  <!-- Network motif: connectors fanning toward the card, echoing the hero. -->
  <g fill="none" stroke="url(#flow)" stroke-width="2" stroke-linecap="round">
    <path d="M600 470 C 470 470 380 520 250 552"/>
    <path d="M600 470 C 470 470 380 560 262 596"/>
    <path d="M600 470 C 730 470 820 520 950 552"/>
    <path d="M600 470 C 730 470 820 560 938 596"/>
  </g>
  <g fill="#FF4B2B" fill-opacity="0.22">
    <circle cx="250" cy="552" r="6"/>
    <circle cx="262" cy="596" r="6"/>
    <circle cx="950" cy="552" r="6"/>
    <circle cx="938" cy="596" r="6"/>
  </g>

  <!-- Emblem -->
  <g transform="translate(550 88) scale(2.0833)">
    <path d="M24 3.4 41.8 13.7v20.6L24 44.6 6.2 34.3V13.7z" fill="url(#hex)"/>
    <path d="M24 8.6 37.2 16.2v15.6L24 39.4 10.8 31.8V16.2z" fill="none" stroke="#0E0E11" stroke-opacity="0.16" stroke-width="1.4"/>
    <path d="M17.5 14H30.5L28.7 17.6H21.1V21.8H29L27.3 25.3H21.1V34H17.5Z" fill="#0E0E11" fill-opacity="0.88"/>
  </g>

  <text x="600" y="330" text-anchor="middle" fill="#0E0E11"
        font-family="Bricolage Grotesque, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="700" letter-spacing="-3">Forge Capmoor</text>

  <text x="600" y="386" text-anchor="middle" fill="#62626B"
        font-family="Plus Jakarta Sans, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="30" letter-spacing="-0.4">AI market intelligence that shows its reasoning</text>

  <rect x="520" y="428" width="160" height="3" rx="1.5" fill="#FF4B2B" fill-opacity="0.32"/>
</svg>
